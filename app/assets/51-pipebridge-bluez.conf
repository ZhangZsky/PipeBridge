# PipeBridge: 蓝牙音频配置 (WirePlumber 0.5+ SPA-JSON)
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# 禁止蓝牙连接后自动成为默认输出：默认设备完全由用户手动掌控。
# node.restore-default-targets=false 关闭 WirePlumber 自动选择/恢复默认目标;
# bluetooth.autoswitch-to-headset-profile=false关闭 A2DP<->HFP 自动切换(与手动策略一致)。
wireplumber.settings = {
    node.restore-default-targets = false
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
    bluez5.enable-sbc-xq = true
    bluez5.enable-msbc = true
    bluez5.enable-hw-volume = true
    # headset-roles 置空: 禁用 HSP/HFP 免提角色，强制蓝牙音箱只走 A2DP 立体声。
    # 启用 HFP/HSP 会让设备协商到单声道 handsfree profile(active_port=handsfree-output),
    # 多设备场景下第二个设备尤其易停在 HFP 单声道; 纯音频输出不需要通话免提功能。
    bluez5.headset-roles = []
}

# 降低蓝牙 A2DP sink 的会话优先级(默认 1010)，使其连接后不高于内置声卡而被自动选默认。
monitor.bluez.rules = [
    {
        matches = [ { node.name = "~bluez_output.*" } ]
        actions = {
            update-props = {
                priority.session = 500
            }
        }
    }
]
