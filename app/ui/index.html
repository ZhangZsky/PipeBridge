<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PipeBridge</title>
    <script>
        // 资源基址兜底：正常情况下后端返回 index.html 时已注入确定的 <base>
        // (基于飞牛网关前缀或 Lucky 反代的实际外层路径),前端无需再计算。
        // 仅当页面被静态直出(未经后端注入,head 中无 <base>)时,才按当前页面
        // 所在目录兜底注入,避免 css/js/images 落到上级目录 404。
        (function () {
            if (document.querySelector('base')) return;
            var path = window.location.pathname;
            var dir;
            if (path.charAt(path.length - 1) === '/') {
                dir = path;
            } else if (/\.[a-zA-Z0-9]+$/.test(path)) {
                // 末段是带扩展名的文件(如 index.html),取其所在目录
                dir = path.slice(0, path.lastIndexOf('/') + 1);
            } else {
                // 末段是无尾斜杠的目录(如网关 /app/PipeBridge),补足尾斜杠
                dir = path + '/';
            }
            var base = document.createElement('base');
            base.href = window.location.origin + (dir || '/');
            document.head.appendChild(base);
        })();
    </script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/bluetooth.css">
    <link rel="stylesheet" href="css/devices.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/dialogs.css">
    <link rel="stylesheet" href="css/system.css">
    <link rel="stylesheet" href="css/misc.css">
</head>
<body>
    <div class="app-container">
        <nav class="tab-nav">
            <button class="tab-item" data-tab="bluetooth">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
                </svg>
                <span>蓝牙</span>
            </button>
            <button class="tab-item" data-tab="audio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <span>音频</span>
            </button>
            <button class="tab-item" data-tab="video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
                <span>视频</span>
            </button>
            <button class="tab-item active" data-tab="system">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>系统</span>
            </button>
        </nav>

        <main class="main-content">
            <section id="bluetoothTab" class="tab-panel">
                <div class="status-bar">
                    <div class="status-left">
                        <div id="overallStatusDot" class="status-dot"></div>
                        <span id="overallStatusText">检测中...</span>
                        <div class="controller-info-inline" id="controllerInfoInline"></div>
                    </div>
                    <div class="status-right">
                        <div class="power-toggle" id="powerToggle" style="display: none;">
                            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18.36 6.64a9 9 0 1 1-12.72 0"/>
                                <line x1="12" y1="2" x2="12" y2="12"/>
                            </svg>
                            <label class="switch">
                                <input type="checkbox" id="powerSwitch">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label">电源</span>
                        </div>
                        <div class="power-toggle discoverable-toggle" id="discoverableToggle" style="display: none;">
                            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <label class="switch">
                                <input type="checkbox" id="discoverableSwitch">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label">发现</span>
                        </div>
                        <div class="power-toggle pairable-toggle" id="pairableToggle" style="display: none;">
                            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                            </svg>
                            <label class="switch">
                                <input type="checkbox" id="pairableSwitch">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label">配对</span>
                        </div>
                        <div class="power-toggle reconnect-toggle" id="reconnectToggle" style="display: none;">
                            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"/>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                            </svg>
                            <label class="switch">
                                <input type="checkbox" id="autoReconnectSwitch">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label">重连</span>
                        </div>
                        <div class="power-toggle obex-receive-toggle" id="obexReceiveToggle">
                            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <label class="switch" title="接收文件开关">
                                <input type="checkbox" id="obexReceiveSwitch">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label">文件</span>
                        </div>
                        <div class="power-toggle tethering-toggle" id="tetheringToggle" style="display: none;">
                            <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            <label class="switch" title="蓝牙共享网络">
                                <input type="checkbox" id="tetheringSwitch">
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-label">共享</span>
                        </div>
                        <button id="scanBtn" class="btn btn-primary btn-scan">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            扫描
                        </button>
                        <button id="installDriverBtn" class="btn btn-accent" style="display: none;">安装驱动</button>
                    </div>
                </div>

                <!-- OBEX 接收授权告警条：Agent 未就绪时提示并提供一键修复 -->
                <div id="obexAgentWarning" class="obex-agent-warning" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span class="obex-agent-warning-text">文件接收授权服务未就绪，手机推送的文件可能被拒绝。</span>
                    <button id="fixObexAgentBtn" class="btn btn-sm btn-accent">一键修复</button>
                </div>


                <div id="controllersGrid" class="controllers-grid">
                    <div class="loading-state"><div class="spinner"></div></div>
                </div>

                <div id="bluetoothDeviceList" class="device-grid">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
                        </svg>
                        <p>点击扫描查找设备</p>
                    </div>
                </div>

                <div class="section-header collapsible-header section-header-spaced" id="fileTransferHeader">
                    <h2>文件传输</h2>
                    <svg class="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    <div class="file-transfer-controls" onclick="event.stopPropagation();">
                        <button class="btn btn-sm btn-secondary" id="clearTransfersBtn">清除记录</button>
                    </div>
                </div>
                <div id="fileTransferList" class="file-transfer-list" style="display:none;">
                    <div class="empty-state">
                        <p>暂无文件传输</p>
                    </div>
                </div>
                <div id="receivedFilesSection" style="display:none;">
                    <div class="section-header received-files-header">
                        <h3>已接收文件</h3>
                    </div>
                    <div id="receivedFilesList" class="received-files-list"></div>
                </div>
            </section>

            <section id="audioTab" class="tab-panel">
                <div class="scan-btn-row">
                    <button id="audioScanBtn" class="btn btn-secondary btn-scan">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        扫描
                    </button>
                </div>
                <div id="audioDeviceList" class="device-grid">
                    <div class="loading-state"><div class="spinner"></div></div>
                </div>
            </section>

            <section id="videoTab" class="tab-panel">
                <div class="scan-btn-row">
                    <button id="videoScanBtn" class="btn btn-secondary btn-scan">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        扫描
                    </button>
                </div>
                <div id="videoDeviceList" class="device-grid">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg>
                        <p>点击扫描查找视频设备</p>
                    </div>
                </div>
            </section>

            <section id="systemTab" class="tab-panel active">
                <div class="scan-btn-row">
                    <button id="fixAllBtn" class="btn btn-accent" style="display: none;">一键修复</button>
                </div>
                <div id="systemOverview" class="overview-container">
                    <div class="loading-state"><div class="spinner"></div></div>
                </div>
            </section>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="pinDialog" class="pin-dialog" style="display: none;">
        <div class="pin-dialog-backdrop"></div>
        <div class="pin-dialog-content">
            <h3>需要 PIN 码</h3>
            <p>此蓝牙设备要求输入 PIN 码才能配对。</p>
            <p class="pin-dialog-device" id="pinDialogDevice"></p>
            <input type="text" id="pinInput" class="pin-input" placeholder="输入 PIN 码（通常为 0000 或 1234）" maxlength="16" autocomplete="off">
            <div class="pin-dialog-actions">
                <button id="pinCancelBtn" class="btn btn-secondary">取消</button>
                <button id="pinConfirmBtn" class="btn btn-accent">确认配对</button>
            </div>
        </div>
    </div>

    <div id="fileSendDialog" class="pin-dialog" style="display: none;">
        <div class="pin-dialog-backdrop"></div>
        <div class="pin-dialog-content">
            <h3>发送文件</h3>
            <p>发送文件到：<span id="fileSendTarget" class="pin-dialog-device file-send-target"></span></p>
            <p class="file-send-hint">对方设备需支持 OBEX 文件传输（OPP），音频设备通常不支持</p>
            <div class="file-select-area" id="fileSelectArea">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>点击选择文件或拖放文件到此处</p>
                <input type="file" id="fileSendInput" style="display:none;">
            </div>
            <div id="fileSendFileInfo" style="display:none;">
                <div class="file-info-row">
                    <span class="detail-label">文件名</span>
                    <span class="detail-value" id="fileSendName">-</span>
                </div>
                <div class="file-info-row">
                    <span class="detail-label">大小</span>
                    <span class="detail-value" id="fileSendSize">-</span>
                </div>
            </div>
            <div id="fileSendProgress" style="display:none;">
                <div class="transfer-progress-bar"><div class="transfer-progress-fill" id="fileSendProgressBar"></div></div>
                <p class="file-send-status" id="fileSendStatus">上传中...</p>
            </div>
            <div class="pin-dialog-actions pin-dialog-actions-spaced">
                <button id="fileSendCancelBtn" class="btn btn-secondary">取消</button>
                <button id="fileSendConfirmBtn" class="btn btn-accent" disabled>发送</button>
            </div>
        </div>
    </div>
    
    <script src="js/core.js"></script>
    <script src="js/render.js"></script>
    <script src="js/bluetooth.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/video.js"></script>
    <script src="js/updates.js"></script>
    <script src="js/system.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
